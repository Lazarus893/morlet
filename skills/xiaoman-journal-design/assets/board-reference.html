<body>
  <header class="brandbar"><div class="wrap"><div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>小满 <span class="muted">/</span> 设计参考</div><span class="sample">虚构样例 · 离线</span></div></header>
  <main class="wrap">
    <section class="intro"><div><div class="kicker">A quiet place for everyday life</div><h1>一件事，一种合适的安排。</h1><p>先看此刻要做什么，再组合手账。结构服务生活，组件不必长成同一种卡片。</p></div><aside>这里的操作只演示当前页面变化，不保存真实账本、不发送提醒，也不产生预约或付款。</aside></section>
    <nav class="nav" aria-label="参考看板"><button type="button" data-mode="birthday" aria-pressed="true">生日准备</button><button type="button" data-mode="moving" aria-pressed="false">搬家办事</button><button type="button" data-mode="evening" aria-pressed="false">平常的晚上</button><button type="button" data-mode="trip" aria-pressed="false">周末出行</button><button type="button" data-mode="atlas" aria-pressed="false">20 种结构</button></nav>
    <section class="scene-head" aria-labelledby="scene-title"><div><div class="kicker" id="scene-label">01 / 准备与决定</div><h2 id="scene-title">把周日留给一场小小的生日。</h2><p id="scene-description">准备是主线；预算与候选解决各自的问题。比较需要时，让它占一整行。</p></div><div class="scene-counter" id="scene-counter"><span>3 个组件</span><span>1 个主焦点</span></div></section>
    <div class="filter-row" id="filters" aria-label="筛选组件类别" hidden><button type="button" data-group="all" aria-pressed="true">全部 20</button><button type="button" data-group="arrange" aria-pressed="false">安排与准备</button><button type="button" data-group="decide" aria-pressed="false">做决定</button><button type="button" data-group="follow" aria-pressed="false">跟进与恢复</button><button type="button" data-group="keep" aria-pressed="false">留下来</button></div>
    <section id="board" class="board" aria-label="生日准备参考组件"></section>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <footer class="resource-note"><p>这是一份通用设计材料。实际任务的材料、类型、动作与权限以小满当次提供的能力契约和正式账本为准；不是把此页的数据导入用户的生活。</p><a href="../references/dashboard-patterns.md">阅读组合取舍</a><button type="button" id="reset">重新演示</button></footer>
  </main>
  <script>
    'use strict';
    const heading=(num,title,kind)=>`<header class="widget-head"><div><span class="kicker">${num} / 任务结构</span><h2>${title}</h2></div><span class="type">${kind}</span></header>`;

    const types=[
      {kind:'agenda',num:'01',title:'今天，留一段空档',group:'arrange',html:()=>`<div class="timeline"><div class="event"><time>14:00</time><div><h3>去图书馆</h3><small>固定安排 · 约一小时</small></div></div><div class="event gap"><time>15:30</time><div><h3>半小时空档</h3><small>把一件灵活的小事放进来</small></div></div><div class="event"><time>16:00</time><div><h3>回家整理</h3><small>留给自己的时间</small></div></div></div>${end(button('把取包裹放进空档','agenda'),'只记下一次安排，不代表已取到。')}`},
      {kind:'time-grid',num:'02',title:'哪一个时段更从容',group:'arrange',full:true,html:()=>`<p class="meta">需 60 分钟，另留 30 分钟缓冲。样例可选情况不代表预约库存。</p><div class="slot-wrap"><table class="slots"><caption class="sr-only">虚构的预约偏好表</caption><thead><tr><th scope="col">时刻</th><th scope="col">周五</th><th scope="col">周六</th><th scope="col">周日</th></tr></thead><tbody><tr><th scope="row">10:00</th><td><div class="unavailable">有冲突</div></td><td><button type="button" data-act="slot" aria-pressed="false" aria-label="记下周六10点偏好">可选</button></td><td><div class="unavailable">待核实</div></td></tr><tr><th scope="row">15:30</th><td><button type="button" data-act="slot" aria-pressed="false" aria-label="记下周五15点30分偏好">可选</button></td><td><button type="button" data-act="slot" aria-pressed="false" aria-label="记下周六15点30分偏好">可选</button></td><td><div class="unavailable">待核实</div></td></tr></tbody></table></div><p class="result" data-result aria-live="polite">选择只代表时间偏好。</p>`},
      {kind:'prep',num:'03',title:'先准备好眼前这一件',group:'arrange',html:()=>`<section class="phase"><h3>提前几天</h3><label class="checkline"><input type="checkbox" data-act="check" checked><span>记下人数与忌口</span></label></section><section class="phase current"><h3>现在 · 把材料备好</h3><label class="checkline"><input type="checkbox" data-act="check"><span>备好蜡烛与打火机</span></label><label class="checkline"><input type="checkbox" data-act="check"><span>确认取蛋糕的时间</span></label></section><section class="phase"><h3>当天</h3><label class="checkline"><input type="checkbox" data-act="check"><span>提前半小时布置桌面</span></label></section><p class="result" data-result aria-live="polite">1 / 4 步已记下。步骤不等于采购订单。</p>`},
      {kind:'decision',num:'04',title:'用同一组条件，选一个',group:'decide',full:true,bare:true,html:()=>`<div class="compare"><article class="option"><div class="swatch">方案 A · 仅文字设计样例</div><h3>安静的小馆 · 临窗区</h3><dl><div><dt>用餐规模</dt><dd>4 位</dd></div><div><dt>参考费用</dt><dd>约 ¥400</dd></div><div><dt>指定时段</dt><dd><span class="tag unknown">余位待确认</span></dd></div><div><dt>需要留意</dt><dd>靠窗，晚间噪声尚未核实</dd></div></dl><div class="choice">${button('记下方案 A','choice')}</div></article><article class="option"><div class="swatch">方案 B · 仅文字设计样例</div><h3>在家做一顿饭</h3><dl><div><dt>用餐规模</dt><dd>4 位</dd></div><div><dt>参考费用</dt><dd>约 ¥260</dd></div><div><dt>指定时段</dt><dd>用户尚未确认</dd></div><div><dt>需要留意</dt><dd>要留出采购与准备时间</dd></div></dl><div class="choice">${button('记下方案 B','choice')}</div></article></div><p class="result" data-result aria-live="polite">样例条件仅帮助比较，记录选择不会产生预约。</p>`},

      {kind:'shopping',num:'06',title:'买什么，家里又有什么',group:'arrange',html:()=>`<section class="shopping-group"><h3>蔬菜区</h3><div class="shopping-row"><label class="checkline"><input type="checkbox" data-act="check"><span>番茄</span></label><small>2 个</small></div><div class="shopping-row"><label class="checkline"><input type="checkbox" data-act="check"><span>菌菇</span></label><small>150 g</small></div></section><section class="shopping-group"><h3>其他</h3><div class="shopping-row"><label class="checkline"><input type="checkbox" data-act="check"><span>牛奶</span></label><small>1 盒</small></div></section><section class="shopping-group"><h3>家里已有</h3><div class="shopping-row"><span>大米</span><span class="tag neutral">已有</span></div></section><p class="result" data-result aria-live="polite">数量和单位保留；家里已有不计作新买。</p>`},
      {kind:'itinerary',num:'07',title:'沿着这条路，慢慢逛',group:'arrange',full:true,html:()=>`<ol class="route"><li class="stop"><span class="num">1</span><div><h3>美术馆</h3><small>先看一小时展览</small></div><time>10:00</time></li><li class="leg" aria-label="第一段交通">步行 · 20 分钟（样例）</li><li class="stop" data-optional-stop><span class="num">2</span><div><h3>街角书店</h3><small>可略过，留一点弹性</small></div><time>11:20</time></li><li class="leg" data-second-leg>步行 · 15 分钟（样例）</li><li class="stop"><span class="num">3</span><div><h3>咖啡店</h3><small>午后坐一会儿</small></div><time data-arrival>12:00</time></li></ol>${end(button('这次略过书店','route'),'改路线后，新的直达路段须重新核实。')}`},
      {kind:'waiting',num:'08',title:'有一件事，等个回音',group:'follow',html:()=>`<div class="person-row"><span class="initial" aria-hidden="true">甲</span><div><h3>朋友甲 · 能否借折叠桌</h3><small>已给答复：可以</small></div><span class="tag">已回应</span></div><div class="person-row"><span class="initial" aria-hidden="true">乙</span><div><h3>朋友乙 · 是否一起晚餐</h3><small>还没收到答复</small></div><span class="tag unknown">待回应</span></div><div class="draft" data-draft hidden><label for="draft-text">给朋友乙的草稿 · 未发送</label><textarea id="draft-text">周日晚上一起吃饭，你方便吗？不着急，方便时告诉我就好。</textarea></div>${end(button('看看跟进草稿','draft'),'查看和编辑草稿都不会发送消息。')}`},

      {kind:'deadline',num:'10',title:'期限之前，留一步余地',group:'follow',html:()=>`<div class="deadline"><div class="dateblock"><strong>10.24</strong><small>样例日期</small></div><div><h3>18:00 前归还两本书</h3><p>明确截止 · 以图书馆真实记录为准</p></div></div><div class="nextline"><b>前一天 12:30</b><span>午休去还书，预留半小时。</span></div>${end(button('记下这一步安排','deadline'),'已安排归还，不代表已经还书。')}`},
      {kind:'reminder',num:'11',title:'出门前，记得带上',group:'follow',html:()=>`<div class="alarm"><div class="clock" data-clock>07:45</div><div><h3>带上冰箱里的饭盒</h3><small>明早 · 冰箱中层</small><span class="tag neutral">提醒计划样例</span></div></div>${end(button('演示延后 15 分钟','snooze'),'只改演示时刻，不调度系统通知。')}`},
      {kind:'habit',num:'12',title:'睡前二十分钟，一周五晚',group:'arrange',html:()=>`<div class="row" style="padding-top:0;border:0"><span>读一会儿书</span><strong class="numbers" data-habit-count>1 / 5 晚</strong></div><div class="week"><div class="day done"><small>一</small><strong>12</strong><span>已记</span></div><div class="day today" data-today><small>二</small><strong>13</strong><span>待记</span></div><div class="day"><small>三</small><strong>14</strong><span>未来</span></div><div class="day"><small>四</small><strong>15</strong><span>未来</span></div><div class="day"><small>五</small><strong>16</strong><span>未来</span></div><div class="day"><small>六</small><strong>17</strong><span>休</span></div><div class="day"><small>日</small><strong>18</strong><span>休</span></div></div>${end(button('记下今晚读过了','habit'),'固定的虚构一周，不读取今天或真实习惯。')}`},
      {kind:'meal',num:'13',title:'两个人，慢慢做一顿饭',group:'arrange',className:'meal-widget',html:()=>`<div class="servings"><h3>番茄菌菇炖饭</h3><label for="servings">份量 <input id="servings" type="number" min="1" max="4" value="2" data-act="servings"> 人</label></div><div class="meal"><div><small>材料 · 随份量调整</small><ul class="ingredients"><li><span>米</span><small data-rice>180 g</small></li><li><span>水</span><small data-water>450 ml</small></li><li><span>番茄</span><small data-tomato>2 个</small></li><li><span>盐</span><small>依口味 · 无定量</small></li></ul></div><div class="step-page"><span class="stepno" data-step-no>01 / 04</span><h3 data-step-title>洗净、切好材料</h3><p data-step-text>番茄切块，菌菇掰小，米淘洗后沥干。</p><small>样例步骤 · 实际熟度请自行判断</small>${button('这步做好了，下一步','meal')}</div></div><p class="result" data-result aria-live="polite">约半小时；时间不随份量等比缩放。</p>`},
      {kind:'collection',num:'14',title:'先留着，还不用决定',group:'keep',html:()=>`<div class="collage"><figure class="material"><div class="material-swatch">浅木色 · 色彩小样</div><figcaption>桌面要轻一点<small>材质灵感，非商品照片</small></figcaption></figure><figure class="material"><div class="material-swatch">亚麻米白</div><figcaption>靠窗的一块布<small>配色参考</small></figcaption></figure><figure class="material"><div class="material-swatch">暖光的位置</div><figcaption>灯放在椅子后面</figcaption></figure></div>${end(button('把这几个念头留着','collect'),'可以同时保留，不必选出优胜项。')}`},
      {kind:'documents',num:'15',title:'带什么材料，一份份看',group:'arrange',full:true,html:()=>`<div class="filefolder"><nav class="filelist" aria-label="样例文件目录"><button type="button" data-act="document" data-doc="lease" aria-pressed="true">租约<small>样例摘要 · 已提供</small></button><button type="button" data-act="document" data-doc="appointment" aria-pressed="false">预约单<small>样例摘要 · 已提供</small></button><button type="button" data-act="document" data-doc="missing" aria-pressed="false">授权书<small>缺一份材料</small></button></nav><article class="document-preview" data-document-preview><span class="tag neutral">虚构摘要 · 非原件</span><h3 style="margin-top:16px">租约</h3><small>样例版本 1 · 供准备时核对</small><div class="document-line"></div><p>留意合同签名页与约定的起止日期；这里没有读取真实文件。</p><p class="meta">机构要求尚未核验，用户清单不代表官方材料要求。</p></article></div><p class="result" data-result aria-live="polite"></p>`},
      {kind:'approval',num:'16',title:'这一次，确认到什么范围',group:'decide',html:()=>`<div class="approval-sheet"><div class="contract-values"><div><small>具体计划</small><strong>周六 10:00</strong><p class="meta">两小时日常保洁</p></div><div><small>样例报价</small><strong class="numbers">¥180</strong><p class="meta">用户上限 ¥200</p></div></div><ul class="terms"><li><span>本次可做</span>核对一次预约请求</li><li><span>费用边界</span>不含支付或额外加项</li><li><span>下一次</span>范围变化后重新确认</li></ul><label class="checkline"><input type="checkbox" data-act="approve-check"><span>我已核对这份样例计划</span></label></div>${end('<button type="button" data-act="approve" disabled>记录本次确认</button>','确认计划不会发送预约或付款。')}`},
      {kind:'recovery',num:'17',title:'卡住了，换一条能走的路',group:'follow',full:true,html:()=>`<p class="recovery-title">寄养单间的余位还没查清。</p><p class="meta">目前无法判断能否预约，不能把未知当作没有余位。</p><div class="evidence"><div><h3>已经知道</h3><p>两份样例资料都提供单间寄养；计划住两晚。</p></div><div><h3>仍然缺少</h3><p>指定两晚是否有空房，以及实际接送时段。</p></div></div><fieldset class="branches"><legend>接下来希望怎么做</legend><label><input type="radio" name="recovery-path" value="继续核实指定两晚余位">继续核实余位</label><label><input type="radio" name="recovery-path" value="改找上门喂猫，并核对时间">改找上门喂猫</label><label><input type="radio" name="recovery-path" value="先留好问题，自己联系">我自己问一问</label></fieldset>${end(button('记下恢复方向','recovery'),'只记录方向，不启动真实重试或联系。')}`},
      {kind:'reflection',num:'18',title:'如果再去一次，会怎么选',group:'keep',html:()=>`<p>这场音乐会，留下什么感觉？</p><fieldset class="rating"><legend>可选评分 · 1 分最低，5 分最高</legend><div class="rating-options">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="rating" value="${n}" aria-label="${n}分"><span aria-hidden="true">${n}</span></label>`).join('')}</div></fieldset><label for="reflection-text" class="reflection-note">留一句自己的话</label><textarea id="reflection-text" placeholder="比如，下次想坐得离舞台远一点。"></textarea>${end(button('留下这次感受','reflection'),'不发布外部评价，不自动形成长期偏好。')}`},
      {kind:'memory',num:'19',title:'留下一页，之后再翻',group:'keep',full:true,bare:true,html:()=>`<article class="memory-page"><div class="memory-date">某个周日 / 用户原话样例</div><blockquote>“慢下来的一下午。”</blockquote><p>沿河走了半小时，坐在树下看了一会儿书。没有赶路，也没有特别的安排。</p><footer><span>一次散步</span><span>约半小时</span></footer></article><details><summary style="cursor:pointer;min-height:44px;color:var(--green)">为什么这里没有大图</summary><p class="meta" style="padding:8px 0 16px">没有用户的真实照片，文字本身就足够；不拿风景素材冒充这段经历。</p></details>`},
      {kind:'handoff',num:'20',title:'谁来做，做到哪一步',group:'follow',full:true,html:()=>`<div class="handoff-pair"><section class="responsibility"><span class="role">自己负责</span><h3>主菜与桌面</h3><ul><li>准备四人份主菜</li><li>开饭前摆好餐具</li></ul></section><section class="responsibility"><span class="role">拟交给朋友甲</span><h3>饮料与冰块</h3><ul><li>无糖饮料六罐</li><li>一袋冰块</li></ul></section></div><div class="delivery-condition">共同交付条件：周六 18:30 前带到。尚未发送，也未收到对方确认。</div>${end(button('记下这份分工','handoff'),'用户记录的分工不代表对方已经接手。')}`}
    ];
    const scenes={birthday:{label:'01 / 准备与决定',title:'把周日留给一场小小的生日。',description:'准备是主线；预算与候选解决各自的问题。比较需要时，让它占一整行。',kinds:['prep','budget','decision']},moving:{label:'02 / 材料与期限',title:'搬家办事，把缺的那一份看清楚。',description:'文件是材料，期限是约束；遇到阻塞再给一条可以继续的路。',kinds:['documents','deadline','recovery']},evening:{label:'03 / 一顿饭与一小段时间',title:'普通的晚上，也可以安排得舒服。',description:'当前步骤、采购数量与跨日期习惯，各用适合的结构，不把一切画成待办。',kinds:['meal','shopping','habit']},trip:{label:'04 / 路线与片段',title:'周末出门，留一点弹性。',description:'路线明确站点和交通连接；预算不代替支付，回忆只收下确实发生的片段。',kinds:['itinerary','budget','memory']},atlas:{label:'05 / 完整结构目录',title:'20 种任务，20 种信息结构。',description:'看信息关系与主要动作：不是换标题、换图片或换颜色。所有数据均为虚构设计样例。',kinds:types.map(t=>t.kind)}};
    let mode='birthday',group='all';
    const board=document.getElementById('board'),live=document.getElementById('live');
    function render(){const s=scenes[mode],list=s.kinds.map(k=>types.find(t=>t.kind===k)).filter(t=>mode!=='atlas'||group==='all'||t.group===group);document.getElementById('scene-label').textContent=s.label;document.getElementById('scene-title').textContent=s.title;document.getElementById('scene-description').textContent=s.description;document.getElementById('scene-counter').innerHTML=mode==='atlas'?`<span>${list.length} / 20</span><span>任务结构</span>`:`<span>${list.length} 个组件</span><span>1 条主线</span>`;document.getElementById('filters').hidden=mode!=='atlas';board.className=`board${mode==='atlas'?' atlas':''}`;board.setAttribute('aria-label',`${s.title}参考组件`);const expanded=new Set();for(let start=0;start<list.length;){if(list[start].full){start++;continue}let end=start;while(end<list.length&&!list[end].full)end++;if((end-start)%2)expanded.add(end-1);start=end}board.innerHTML=list.map((t,i)=>`<article class="widget${t.full||expanded.has(i)?' full':''}${t.bare?' wide-content':''}${t.className?' '+t.className:''}" data-kind="${t.kind}" style="animation-delay:${Math.min(i,3)*35}ms">${heading(t.num,t.title,t.kind)}${t.html()}</article>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===group)));}
    function result(widget,text){const r=widget.querySelector('[data-result]');if(r){r.textContent=text;r.classList.remove('saved');void r.offsetWidth;r.classList.add('saved')}live.textContent=text;}
    document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;group='all';render();live.textContent=`已切换到${b.textContent}，虚构设计样例。`;return}if(b.dataset.group){group=b.dataset.group;render();live.textContent=`显示${b.textContent}组件。`;return}if(b.id==='reset'){render();live.textContent='当前虚构样例已重置。';return}const w=b.closest('[data-kind]');if(!w)return;switch(b.dataset.act){case'agenda':b.textContent='已记下：15:30 取包裹';b.disabled=true;result(w,'样例安排已记下，实际取件尚未完成。');break;case'slot':w.querySelectorAll('[data-act=slot]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));result(w,`${b.getAttribute('aria-label').replace('记下','')}已记下（演示）；预约尚未发生。`);break;case'choice':w.querySelectorAll('.option').forEach(o=>o.classList.toggle('selected',o===b.closest('.option')));w.querySelectorAll('[data-act=choice]').forEach(x=>x.textContent=x===b?'已记下此方案':x.closest('.option')===w.querySelector('.option')?'记下方案 A':'记下方案 B');result(w,'选择已记下（演示）。指定日期、余位与预约结果仍待确认。');break;case'reserve':w.querySelector('[data-balance]').textContent='¥120';w.querySelector('[data-budget-row]').textContent='已预留 ¥80';w.querySelector('[data-reserve-bar]').style.width='10%';w.querySelector('[data-balance-bar]').style.width='15%';b.disabled=true;b.textContent='已预留 ¥80';result(w,'演示预算：400 + 200 + 80 + 120 = 800；未发生付款。');break;case'route':w.querySelector('[data-optional-stop]').hidden=true;w.querySelector('[data-second-leg]').hidden=true;w.querySelector('.leg').textContent='美术馆 → 咖啡店 · 直达方式与用时待核实';w.querySelector('[data-arrival]').textContent='待核实';b.disabled=true;b.textContent='本次略过书店';result(w,'路线取舍已记下（演示）；不把旧的 20 + 15 分钟当作新直达时间。');break;case'draft':{const panel=w.querySelector('[data-draft]');panel.hidden=!panel.hidden;b.textContent=panel.hidden?'看看跟进草稿':'收起草稿';if(!panel.hidden)panel.querySelector('textarea').focus();result(w,panel.hidden?'草稿已收起，未发送。':'草稿已展开，未发送。');break}case'receipt':result(w,'样例回执：10 月 22 日 09:10，已离开分拨点。无派送或签收证据。');break;case'deadline':b.textContent='下一步安排已记下';b.disabled=true;result(w,'安排已记下（演示）；还书期限与待归还状态保留。');break;case'snooze':w.querySelector('[data-clock]').textContent='08:00';b.disabled=true;b.textContent='演示时刻已延后';result(w,'仅把本次虚构时刻改为 08:00，没有调度或发送通知。');break;case'habit':{const done=b.dataset.done==='true';b.dataset.done=String(!done);w.querySelector('[data-habit-count]').textContent=done?'1 / 5 晚':'2 / 5 晚';w.querySelector('[data-today]').classList.toggle('done',!done);w.querySelector('[data-today] span').textContent=done?'待记':'已记';b.textContent=done?'记下今晚读过了':'撤回这次演示记录';result(w,done?'演示记录已撤回。':'演示打卡已记下，没有写入真实习惯。');break}case'meal':{const steps=[['洗净、切好材料','番茄切块，菌菇掰小，米淘洗后沥干。'],['把番茄和菌菇炒香','锅热后下少许油，炒至番茄出汁。'],['加入米与水，小火焖煮','依锅具和米的熟度调整，留意不要烧干。'],['调味，开饭','尝一下咸淡，确认米饭熟透。']];let n=Number(b.dataset.step||0)+1;b.dataset.step=String(n);if(n<4){w.querySelector('[data-step-no]').textContent=`0${n+1} / 04`;w.querySelector('[data-step-title]').textContent=steps[n][0];w.querySelector('[data-step-text]').textContent=steps[n][1];result(w,`演示推进到第 ${n+1} 步，左边材料保持原位。`)}else{b.disabled=true;b.textContent='步骤都记下了';result(w,'四步已记录（演示）。实际食物熟度由使用者判断。')}break}case'collect':b.textContent='这三个念头都留着';b.disabled=true;result(w,'三个虚构念头并存，没有生成购买任务。');break;case'document':{w.querySelectorAll('[data-doc]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const preview=w.querySelector('[data-document-preview]');if(b.dataset.doc==='lease')preview.innerHTML='<span class="tag neutral">虚构摘要 · 非原件</span><h3 style="margin-top:16px">租约</h3><small>样例版本 1 · 供准备时核对</small><div class="document-line"></div><p>留意合同签名页与约定的起止日期；这里没有读取真实文件。</p><p class="meta">机构要求尚未核验。</p>';else if(b.dataset.doc==='appointment')preview.innerHTML='<span class="tag neutral">虚构摘要 · 非原件</span><h3 style="margin-top:16px">预约单</h3><small>样例时间 · 周五 10:00</small><div class="document-line"></div><p>核对地点、入场要求与本人证件；不代表真实预约已创建。</p>';else preview.innerHTML='<span class="tag unknown">缺少材料</span><h3 style="margin-top:16px">授权书</h3><p>尚未提供。没有可预览的真实文件，也不能据此声称已获得授权。</p><p class="meta">请按实际机构要求核对是否需要。</p>';result(w,'已切换当前样例材料；没有读取本机文件。');break}case'approve':b.disabled=true;w.querySelector('[data-act=approve-check]').disabled=true;b.textContent='本次确认已记录';result(w,'确认已记录（演示）；预约请求尚未发送，也未付款。');break;case'recovery':{const chosen=w.querySelector('input[name=recovery-path]:checked');result(w,chosen?`已记下：${chosen.value}（演示）。实际阻塞仍未解决。`:'先选一个希望继续的方向，已有材料会保留。');break}case'reflection':{const text=w.querySelector('textarea').value.trim(),rating=w.querySelector('input[name=rating]:checked');result(w,text||rating?'本次感受已收在演示页；没有发布评价或写入真实长期记忆。':'留一句话或选一个评分即可，当前输入会保留。');break}case'handoff':b.textContent='分工已记下';b.disabled=true;result(w,'分工已记录（演示）；尚未告知，也未收到对方确认。');break}});
    document.addEventListener('change',event=>{const input=event.target,w=input.closest('[data-kind]');if(!w)return;if(input.dataset.act==='check')result(w,input.checked?'这一步已记下（演示），未产生订单或外部动作。':'这一步演示记录已撤回。');if(input.dataset.act==='approve-check'){w.querySelector('[data-act=approve]').disabled=!input.checked;result(w,input.checked?'已核对当前样例范围，仍需记录本次确认。':'核对已撤回，尚未记录确认。')}if(input.dataset.act==='servings'){const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>4){result(w,'演示份量为 1–4 人，材料未改。');return}w.querySelector('[data-rice]').textContent=`${90*n} g`;w.querySelector('[data-water]').textContent=`${225*n} ml`;w.querySelector('[data-tomato]').textContent=`${n} 个`;result(w,`已演示 ${n} 人份；盐仍依口味，烹饪时间不等比缩放。`)}});
    render();
  </script>
</body>
</html>
